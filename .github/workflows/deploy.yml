# Workflow de despliegue automático a STAGING
# Ubicación en el repo: .github/workflows/deploy.yml
#
# Funcionamiento:
# - Cada push a la rama "staging" dispara este workflow.
# - Se ejecuta en el self-hosted runner instalado en el servidor.
# - Compila la app Next.js y reinicia el servicio PM2 de staging.

name: Deploy to Vercel
on:
  push:
    branches:
      - staging # O la rama que estés usando

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
